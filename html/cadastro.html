<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="../css/cadastro.css">
    <title>Cadastro - EvoED</title>
</head>
<body>
    
    <div class="conteinerCadastro">
        <div class="colunaEsquerda">
            <div class="card">
                <h1>Crie sua conta</h1>
                
            <form>
                <h2>Nome</h2>
                <input type="name" placeholder="Digite o seu nome completo" required>
                
                <h2>Email</h2>
                <input type="email" placeholder="Digite o seu E-mail" required>
                
                <h2>Senha</h2>
                <input type="password" placeholder="Digite a sua senha" required>
                
                <h2>Telefone</h2>
                <input type="tel" placeholder="Digite o seu telefone" required>
                
                <a href="../html/login.html"><button>Cadastrar</button></a>
            </form>
            </div>
        </div>
        <div class="colunaDireita">
            <img src="../img/cadastro.jpg" alt="">
        </div>
    </div>

    <script src="../js/cadastro.js"></script>
</html>
